name: PX4 Helper libs C++ CI

on:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [runs-on,"runner=${{ vars.RUNSON_CI_BUILDER_DEFAULT_ARM64 }}","run-id=${{ github.run_id }}"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build build-essential libgtest-dev

          # build Google Test
          cd /usr/src/gtest
          cmake .
          make
          cp lib/*.a /usr/lib

      - name: Configure project
        run: |
              mkdir -p build
              cd build
              cmake -S . -B build \
                        -DCMAKE_BUILD_TYPE=Release \
                        -DCMAKE_CXX_FLAGS="-Werror" \
                        -G Ninja

      - name: Build project
        run: cmake --build build

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure
